- defaults:
    link:
      relink: true

- clean:
    - '~'
    - '~/.config'

- link:
    ~/.profile: profile
    ~/.gitconfig: gitconfig
    ~/.p10k.zsh: p10k.zsh
    ~/.ssh/config:
        path: ssh/config
        create: true
    ~/.zprofile: zprofile
    ~/.zshenv: zshenv
    ~/.zshrc: zshrc
    ~/.aerospace.toml:
      path: aerospace/aerospace.toml
      create: true
    ~/.config/:
      create: true
      glob: true
      path: config/*
